name: Deploy geofeed

on:
  push:
    branches:
      - main
    paths:
      - range.csv
  workflow_dispatch:

concurrency:
  group: geofeed-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate geofeed
        run: python3 scripts/validate_geofeed.py range.csv

      - name: Deploy geofeed
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          quiet: true
